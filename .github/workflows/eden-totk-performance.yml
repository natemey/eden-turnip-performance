
name: Eden TOTK Turnip Performance ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Download WinNative source
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/WinNative-Emu/Drivers/archive/refs/heads/main.zip \
            -o drivers.zip
          unzip -q drivers.zip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git ninja-build patchelf unzip curl \
            python3-pip python3-mako flex bison zip \
            glslang-tools ccache clang llvm pkg-config \
            libdrm-dev libexpat1-dev
          sudo python3 -m pip install \
            --break-system-packages \
            'meson>=1.4' mako

      - name: Download Android NDK r26d
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://dl.google.com/android/repository/android-ndk-r26d-linux.zip \
            -o /tmp/android-ndk.zip
          unzip -q /tmp/android-ndk.zip -d /opt
          echo "ANDROID_NDK_HOME=/opt/android-ndk-r26d" >> "$GITHUB_ENV"

      - name: Build Turnip Performance
        working-directory: Drivers-main
        env:
          BUILD_VERSION: Eden-TOTK
          BUILD_VARIANTS: p
        run: |
          set -euo pipefail
          chmod +x build_wn_turnip.sh build_turnip.sh
          ./build_wn_turnip.sh

      - name: Verify driver package
        run: |
          set -euo pipefail
          DRIVER="WN-Turnip-Eden-TOTK-p_Axxx.zip"
          test -s "$DRIVER"
          unzip -t "$DRIVER"
          unzip -l "$DRIVER"
          unzip -p "$DRIVER" meta.json
          unzip -p "$DRIVER" libvulkan_freedreno.so \
            | file -

      - name: Upload driver and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-TOTK-Performance
          path: |
            WN-Turnip-Eden-TOTK-p_Axxx.zip
            Drivers-main/build_log_p.txt
            Drivers-main/mesa_hash.txt
            Drivers-main/mesa_version.txt
          if-no-files-found: warn
