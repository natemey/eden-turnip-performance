
name: Eden TOTK Turnip Performance ARM64

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Download WinNative build scripts
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            https://github.com/WinNative-Emu/Drivers/archive/refs/heads/main.zip \
            -o drivers.zip
          unzip -q drivers.zip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git ninja-build patchelf unzip curl \
            python3-pip flex bison zip glslang-tools \
            ccache clang llvm pkg-config
          sudo python3 -m pip install \
            --break-system-packages \
            'meson>=1.4' mako

      - name: Set up Android NDK r26d
        id: ndk
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Build maximum-performance Turnip
        working-directory: Drivers-main
        env:
          BUILD_VERSION: Eden-TOTK
          BUILD_VARIANTS: p
        run: |
          set -euo pipefail
          chmod +x build_wn_turnip.sh
          ./build_wn_turnip.sh

      - name: Locate and verify driver ZIP
        if: success()
        run: |
          find Drivers-main -type f -name '*.zip' -print
          find Drivers-main -type f -name '*.zip' \
            -exec unzip -t {} \;

      - name: Upload driver and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-TOTK-Performance
          path: |
            Drivers-main/**/*.zip
            Drivers-main/*.zip
            Drivers-main/*log*
            Drivers-main/mesa_hash.txt
            Drivers-main/mesa_version.txt
          if-no-files-found: warn
