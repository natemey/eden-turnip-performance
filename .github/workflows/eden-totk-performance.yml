name: Eden TOTK Turnip Performance ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Download WinNative build scripts
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/WinNative-Emu
/Drivers/archive/refs/heads/main.zip -o drivers.zip
          unzip -q drivers.zip

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends git ninja-build patchelf unzip curl python3-pip flex bison zip glslang-tools ccache pkg-config
          sudo python3 -m pip install --quiet --break-system-packages 'meson>=1.4' mako

      - name: Set up Android NDK r26d
        id: ndk
        uses: nttld/setup-ndk@afb4c9964b521afb97c864b7d40b11e6911bd410
        with:
          ndk-version: r26d
          add-to-path: false
          local-cache: true

      - name: Build maximum-performance Turnip
        working-directory: Drivers-main
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          BUILD_VERSION: Eden-TOTK
          BUILD_VARIANTS: p
        run: |
          set -euo pipefail
          chmod +x build_wn_turnip.sh build_turnip.sh verify_patches.sh
          ./build_wn_turnip.sh
          ./verify_patches.sh p
          test -s WN-Turnip-Eden-TOTK-p_Axxx.zip
          unzip -t WN-Turnip-Eden-TOTK-p_Axxx.zip
          unzip -l WN-Turnip-Eden-TOTK-p_Axxx.zip

      - name: Upload driver and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Eden-TOTK-Performance
          path: |
            Drivers-main/WN-Turnip-Eden-TOTK-p_Axxx.zip
            Drivers-main/build_log_p.txt
            Drivers-main/mesa_hash.txt
            Drivers-main/mesa_version.txt
          if-no-files-found: warn
